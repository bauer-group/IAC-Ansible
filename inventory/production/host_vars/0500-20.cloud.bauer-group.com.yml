---
# =============================================================================
# Host: 0047-20.cloud.bauer-group.com
# Asset: 0047 | Group: 20 (Public Cloud)
# =============================================================================
# Purpose: Docker application host (Docker Compose workloads) — Coolify-managed
#          REMOTE server. The Coolify control plane (asset 0046-20, dashboard at
#          paas.cloud.bauer-group.com) deploys and manages the container
#          workloads here over SSH; this host runs the Docker runtime only,
#          NOT the Coolify control plane (hence it is not in coolify_hosts).
#
# Ansible provisions only the bare end state — Docker + hardened SSH — from
# scratch: `playbooks/site.yml --limit 0047-20.cloud.bauer-group.com` takes a
# blank Ubuntu 24.04 LTS and converges it; re-runs are idempotent no-ops.
# Coolify's own SSH key is added out-of-band via the Coolify UI and is
# intentionally not tracked in this inventory.

platform: ubuntu_2604

asset_id: "0500"
group_code: "20"
asset_type: docker_host

labels:
  - production
  - public-cloud
  - ubuntu
  - docker-host
  - coolify-managed
  - auto-update

# --- Hostname: already set during bootstrap (install.sh + IAC_HOSTNAME) ---

# --- UFW: off (Docker manages iptables directly; UFW would conflict) ---
common_firewall_ufw_state: "disabled"

# --- AppArmor: stays at the global default (disabled + masked) ---

# --- Netplan ---

