---
name: 🧪 Molecule Tests

on:
  push:
    branches: [main, staging]
    paths:
      - 'roles/**'
      - 'requirements.yml'
      - 'requirements.txt'
  pull_request:
    branches: [main]
    paths:
      - 'roles/**'
  # Manual trigger — re-run after upstream mirror outages, validate hot-fixes,
  # or test a single role on demand without a code push.
  workflow_dispatch:
    inputs:
      role:
        description: "Role to test (leave 'all' to run the full matrix)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - common
          - ansible_pull
          - auto_update
          - docker
          - smartmon
          - coolify
          - traefik
          - secrets
          - k0s
          - secondary_dns

permissions:
  contents: read

jobs:
  molecule:
    name: 🔬 ${{ matrix.role }} (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - role: common
            scenario: default
          - role: ansible_pull
            scenario: default
          - role: auto_update
            scenario: default
          - role: docker
            scenario: default
          - role: smartmon
            scenario: default
          - role: coolify
            scenario: default
          - role: traefik
            scenario: default
          - role: secrets
            scenario: default
          - role: k0s
            scenario: default
          - role: k0s
            scenario: overlay
          - role: secondary_dns
            scenario: default

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - name: 🐍 Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          pip install -r requirements.txt

      - name: 📚 Install Ansible collections
        # galaxy.ansible.com intermittently answers with a body that has no
        # 'results' key. ansible-core caches that response and then dies
        # reading it back (KeyError: 'results' -> exit 250) — it killed one
        # matrix job on 2026-08-23 while the other ten installed the same
        # collections in the same second. Runners start with a cold cache, so
        # the bad entry is written and re-read inside a single invocation:
        # --clear-response-cache would be a no-op, --no-cache skips the branch
        # entirely and lets a bad response surface as a retryable error.
        run: |
          for attempt in 1 2 3; do
            if ansible-galaxy collection install -r requirements.yml --force --no-cache; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              delay=$(( attempt * 20 ))
              echo "::warning::ansible-galaxy attempt ${attempt}/3 failed; retrying in ${delay}s"
              sleep "${delay}"
            fi
          done
          echo "::error::ansible-galaxy collection install failed after 3 attempts"
          exit 1

      - name: 🧪 Run Molecule tests
        # Manual single-role runs: skip the test when this matrix entry isn't
        # the selected role. Auto-triggers (push/PR) and 'all' run everything.
        # The `matrix` context is only available at step level, not job level —
        # so we skip the heavy step rather than the whole job.
        if: >-
          github.event_name != 'workflow_dispatch'
          || inputs.role == 'all'
          || inputs.role == matrix.role
        working-directory: roles/${{ matrix.role }}
        run: |
          molecule test -s ${{ matrix.scenario }}
        env:
          ANSIBLE_FORCE_COLOR: "true"
          PY_COLORS: "1"
